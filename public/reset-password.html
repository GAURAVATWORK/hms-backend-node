<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - HMS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f5f5f5;
        }

        .container {
            width: 100%;
            max-width: 420px;

            margin: 20px;
            padding: 32px;

            background: white;

            border-radius: 12px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;

            text-align: center;
        }

        .subtitle {
            margin-bottom: 28px;

            text-align: center;

            color: #666;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
        }

        input:focus {
            outline: none;

            border-color: #555;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;

            text-align: center;

            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .success {
            text-align: center;
        }

        .success h2 {
            margin-bottom: 10px;
        }

    </style>

</head>

<body>

    <main class="container">

        <!-- Password reset form -->

        <section id="reset-form">

            <h1>
                Reset Password
            </h1>

            <p class="subtitle">
                Enter your new password below.
            </p>

            <div class="field">

                <label for="password">
                    New Password
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Enter new password"
                >

            </div>

            <div class="field">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    id="confirm-password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Confirm new password"
                >

            </div>

            <button id="reset-button">
                Reset Password
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </section>


        <!-- Success state -->

        <section
            id="success-state"
            class="success hidden"
        >

            <h2>
                Password Reset Successfully
            </h2>

            <p>
                Your password has been reset successfully.
            </p>

            <p>
                You can now log in with your new password.
            </p>

        </section>

    </main>


    <script>

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirm-password");

        const resetButton =
            document.getElementById("reset-button");

        const message =
            document.getElementById("message");

        const resetForm =
            document.getElementById("reset-form");

        const successState =
            document.getElementById("success-state");


        // Read the reset token from the URL.

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const resetToken =
            urlParams.get("token");


        resetButton.addEventListener(
            "click",
            async () => {

                message.textContent = "";


                // Make sure the URL contains a token.

                if (!resetToken) {

                    message.textContent =
                        "Invalid password reset link.";

                    return;
                }


                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                // Validate new password.

                if (!password) {

                    message.textContent =
                        "Please enter your new password.";

                    passwordInput.focus();

                    return;
                }


                // Validate confirmation password.

                if (!confirmPassword) {

                    message.textContent =
                        "Please confirm your new password.";

                    confirmPasswordInput.focus();

                    return;
                }


                // Frontend-only confirmation check.
                //
                // API will NOT be called when
                // the passwords don't match.

                if (password !== confirmPassword) {

                    message.textContent =
                        "Password and confirm password must match.";

                    confirmPasswordInput.focus();

                    return;
                }


                // Basic frontend password validation.

                if (password.length < 8) {

                    message.textContent =
                        "Password must be at least 8 characters.";

                    passwordInput.focus();

                    return;
                }


                resetButton.disabled = true;

                resetButton.textContent =
                    "Resetting...";


                try {

                    const response =
                        await fetch(
                            "/api/v1/auth/reset-password",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    token: resetToken,
                                    newPassword: password
                                })
                            }
                        );


                    const result =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            result.error?.message ||
                            "Unable to reset password.";

                        resetButton.disabled = false;

                        resetButton.textContent =
                            "Reset Password";

                        return;
                    }


                    // Hide the form.

                    resetForm.classList.add(
                        "hidden"
                    );


                    // Show success state.

                    successState.classList.remove(
                        "hidden"
                    );

                } catch (error) {

                    console.error(
                        "Password reset request failed:",
                        error
                    );

                    message.textContent =
                        "Unable to reset password. Please try again.";

                    resetButton.disabled = false;

                    resetButton.textContent =
                        "Reset Password";
                }

            }
        );

    </script>

</body>

</html>
